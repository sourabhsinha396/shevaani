[project]
name = "shevaani-api"
version = "0.1.0"
description = "Shevaani — English learning platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "arq>=0.26",
    # Data-plane admin at /admin. itsdangerous is what signs its session cookie.
    "sqladmin>=0.20",
    "itsdangerous>=2.2",
    "httpx>=0.28",
    # Used only for `Webhook.construct_event`; the checkout call itself is httpx,
    # because the SDK is synchronous. See integrations/payments.py.
    "stripe>=11.1",
    "razorpay>=1.4",
    # S3-compatible object storage (Cloudflare R2 / S3). Synchronous, so every
    # call runs in a thread — see integrations/storage.py.
    "boto3>=1.35",
    # The full IANA database, including the "backward" compatibility links that
    # the slim base image's system tzdata leaves out. Without it `ZoneInfo` has
    # ~486 zones and raises on every legacy alias — including `Asia/Calcutta`,
    # which is what Chrome on Windows still reports across India, and which
    # signup sends straight from the browser. Registration 422'd on it.
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
